<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="assets/vendor/react.production.min.js"></script>
<script src="assets/vendor/react-dom.production.min.js"></script>
<script src="./support.js"></script>
<script src="assets/afel-config.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Vérifier une carte | AFEL</title>
<link rel="stylesheet" href="assets/afel-fonts.css">
<style>body{margin:0;background:#283D5C}*{box-sizing:border-box}a{color:#FFFFFF}a:hover{color:#F4A340}input,button{font:inherit}</style>
</helmet>
<div style="min-height:100vh;background:#283D5C;color:#FFFFFF;font-family:'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;gap:28px;padding:clamp(28px,6vw,64px) 20px;position:relative;overflow:hidden">
  <div style="width:100%;max-width:1100px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1">
    <a href="index.html" aria-label="Retour à l’accueil AFEL" style="display:block;width:200px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)" style-hover="transform:scale(1.04)"><dc-import name="Logo" variant="horizontal" theme="negatif" style="width:200px" hint-size="200px,47px"></dc-import></a>
    <nav aria-label="Navigation" style="display:flex;flex-wrap:wrap;gap:10px">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#35BDB2;color:#283D5C;font-size:15px;font-weight:700;text-decoration:none;transition:background .25s, transform .3s cubic-bezier(.34,1.56,.64,1)" style-hover="background:#FFFFFF;color:#283D5C;transform:translateX(-3px)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6"></path></svg>Retour au site</a>
      <a href="carte-vip-premium.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid #FFFFFF;border-radius:999px;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none;transition:background .25s, color .25s" style-hover="background:#FFFFFF;color:#283D5C">La carte VIP Premium</a>
    </nav>
  </div>
  <div style="width:100%;max-width:520px;background:#FFFFFF;color:#283D5C;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:clamp(24px,5vw,40px);position:relative;z-index:1">
    <span style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;letter-spacing:.18em;color:#5A6B82">VÉRIFICATION DE CARTE</span>
    <form onSubmit="{{ check }}" style="width:100%;display:flex;gap:8px">
      <input value="{{ q }}" onInput="{{ onQ }}" placeholder="AFEL-2024-00101" aria-label="Numéro de carte" style="flex:1;min-width:0;min-height:48px;padding:0 14px;border:1.5px solid #C9D3E0;color:#283D5C;font-weight:700;outline:none" style-focus="border-color:#35BDB2">
      <button type="submit" style="min-height:48px;padding:0 18px;border:none;background:#283D5C;color:#FFFFFF;font-weight:700;cursor:pointer" style-hover="background:#35BDB2;color:#283D5C">Vérifier</button>
    </form>
    <sc-if value="{{ hasResult }}">
      <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px;border-top:1px solid #E3E6EA">
        <span style="width:84px;height:84px;border-radius:50%;background:{{ r.color }};display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ r.ok }}"><svg viewBox="0 0 24 24" width="44" height="44"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3"></path></svg></sc-if>
          <sc-if value="{{ r.ko }}"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#FFFFFF" stroke-width="3"></path></svg></sc-if>
        </span>
        <strong style="font-family:'Quicksand',sans-serif;font-size:28px;color:{{ r.color }}">{{ r.title }}</strong>
        <sc-if value="{{ r.found }}">
          <div style="display:flex;flex-direction:column;gap:4px">
            <span style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:22px">{{ r.name }}</span>
            <span style="font-weight:700;color:#5A6B82">{{ r.statut }} · {{ r.num }}</span>
          </div>
        </sc-if>
        <span style="font-size:15px;color:#5A6B82;text-wrap:pretty">{{ r.text }}</span>
      </div>
    </sc-if>
  </div>
  <span style="font-size:14px;color:#C9D3E0;position:relative;z-index:1">En cas de doute : +237 658 595 657 · contact@afel.cm</span>
  <img src="assets/ornement-frise-blanc.svg" alt="" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:56px;object-fit:cover;object-position:left;opacity:.3">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const fmtDate = d => { const [y, m, j] = d.split('-'); return `${j}/${m}/${y}`; };
class Component extends DCLogic {
  state = { q: decodeURIComponent((window.location.hash || '').slice(1)), done: '', loading: false, res: null };
  componentDidMount() { if (this.state.q) this.verify(this.state.q); }
  check = e => { e.preventDefault(); this.verify(this.state.q); };
  verify(q) {
    const id = q.trim().toUpperCase();
    if (!id) return;
    this.setState({ done: id, loading: true, res: null });
    window.afelRpc('verifier_carte', { p_num: id })
      .then(rows => this.setState({ loading: false, res: { rows } }))
      .catch(() => this.setState({ loading: false, res: { error: true } }));
  }
  renderVals() {
    const { done, loading, res } = this.state;
    let r = null;
    if (done && loading) r = { ok: false, ko: false, found: false, color: '#5A6B82', title: 'Vérification…', text: 'Interrogation du registre de l’AFEL.' };
    else if (done && res && res.error) r = { ok: false, ko: true, found: false, color: '#A01D1D', title: 'Vérification impossible', text: 'Le registre ne répond pas. Vérifiez votre connexion et réessayez.' };
    else if (done && res) {
      const m = res.rows && res.rows[0];
      const name = m ? [m.prenom, m.nom].filter(Boolean).join(' ') : '';
      if (!m) r = { ok: false, ko: true, found: false, color: '#A01D1D', title: 'Carte inconnue', text: 'Ce numéro ne correspond à aucune carte VIP Premium de l’AFEL.' };
      else if (m.valide) r = { ok: true, ko: false, found: true, color: '#1F8F86', title: 'Carte valide', name, statut: m.statut, num: done, text: 'Carte de membre VIP Premium attribuée par la présidente de l’AFEL.' + (m.vip_fin ? ' Valable jusqu’au ' + fmtDate(m.vip_fin) + '.' : '') };
      else r = { ok: false, ko: true, found: true, color: '#A01D1D', title: 'Carte non valide', name, statut: m.statut, num: done, text: 'Cette carte a été révoquée ou n’est plus valable.' };
    }
    return { q: this.state.q, onQ: e => this.setState({ q: e.target.value }), check: this.check, hasResult: !!r, r: r || {} };
  }
}
</script>
</body>
</html>
